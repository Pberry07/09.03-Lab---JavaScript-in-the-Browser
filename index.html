<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Starting Lineup</title>
  <meta name="description" content="A form to keep track of you line up for football">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Starting Lineup</h1>
  <p>
    <fieldset>
      <legend>Status:</legend>
      
      <input type="radio" id="Draft" name="status">
      <label for="draft">Draft</label>

      <input type="radio" id="Final" name="status" checked>
      <label for="Final">Final</label>

    </fieldset>
  </p>
  <p>
    <label for="gameDay">Date: </label>
    <select name="gameDate" id="gameDay">
      <option value="March 20">March 20</option>
      <option value="March 24">March 24</option>
      <option value="April 2">April 2</option>
      <option value="April 6">April 6</option>
      <option value="April 13">April 13</option>
    </select>
  </p>
  <p>
    <fieldset>
      <legend>Players:</legend>
      
      <input type="checkbox" id="Aarav Agarwal" name="player">
      <label for="Aarav Agarwal">Aarav Agarwal</label>
      <br>
      <input type="checkbox" id="Ava Johnson" name="player">
      <label for="Ava Johnson">Ava Johnson</label>
      <br>
      <input type="checkbox" id="Julio Ortiz" name="player">
      <label for="Julio Ortiz">Julio Ortiz</label>
      <br>
      <input type="checkbox" id="Liam Rubio" name="player">
      <label for="Liam Rubio">Liam Rubio</label>
      <br>
      <input type="checkbox" id="Emma Witherspoon" name="player">
      <label for="Emma Witherspoon">Emma Witherspoon</label>

    </fieldset>
  </p>
  <input type="submit" id="submitButton" class="submit" value="Submit">
  <script src="script.js"></script>
</body>

</html>
